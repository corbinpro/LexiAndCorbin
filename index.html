<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Bridal Shower</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      height: 100vh;
    }

    .invitation-img {
      height: 100%;
      width: auto;
      display: block;
    }

    .links {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .links a img {
      height: 6vh;
      width: auto;
      display: block;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .links a:hover img {
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="invitation-img" src="images/80percent.png" alt="Lexi's Bridal Shower Invitation" />
    <nav class="links">
      <a href="#placeholder"><img src="images/RSVPbutton.png" alt="RSVP" /></a>
      <a href="registry.html"><img src="images/registryButton.png" alt="Registry" /></a>
    </nav>
  </div>
  <script>
    ['images/registry_page.png','images/amazonRegistryButton.png','images/targetRegistryButton.png']
      .forEach(src => new Image().src = src);
  </script>
</body>
</html>
