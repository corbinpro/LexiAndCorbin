<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Bridal Shower</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .card {
      position: relative;
      width: min(calc(100vw - 16px), calc((100vh - 16px) * 1429 / 2000));
      aspect-ratio: 1429 / 2000;
    }

    .invitation-img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .links {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .links a {
      border-radius: 12px;
      display: inline-block;
    }

    .links a img {
      height: 6vh;
      width: auto;
      display: block;
      border-radius: 12px;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .links a:hover img {
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="invitation-img" src="images/80percent.png" alt="Lexi's Bridal Shower Invitation" />
    <nav class="links">
      <a href="https://forms.gle/5W6Cj3sw5gh5LLfb6"><img src="images/RSVPbutton.png" alt="RSVP" /></a>
      <a href="registry.html"><img src="images/registryButton.png" alt="Registry" /></a>
    </nav>
  </div>
  <script>
    ['images/registry_page.png','images/amazonRegistryButton.png','images/targetRegistryButton.png']
      .forEach(src => new Image().src = src);

    const style = document.createElement('style');
    style.textContent = `
      @keyframes ghost-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(106,176,224,0.7); }
        70%  { box-shadow: 0 0 0 10px rgba(106,176,224,0); }
        100% { box-shadow: 0 0 0 0 rgba(106,176,224,0); }
      }
      .pulse { animation: ghost-pulse 2s ease-out infinite; }
    `;
    document.head.appendChild(style);
    document.querySelectorAll('.links a').forEach(el => el.classList.add('pulse'));
  </script>
</body>
</html>
