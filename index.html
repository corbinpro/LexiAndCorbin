<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Bridal Shower</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #fef9e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .invitation-img {
      width: 100%;
      max-width: 420px;
      display: block;
      border-radius: 4px;
    }

    .links {
      display: flex;
      gap: 2.5rem;
      margin-top: 1.25rem;
    }

    .links a {
      font-family: 'Dancing Script', cursive;
      font-size: 1.75rem;
      font-weight: 700;
      color: #6ab0e0;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img class="invitation-img" src="images/80percent.png" alt="Lexi's Bridal Shower Invitation" />
  <nav class="links">
    <a href="#placeholder">RSVP</a>
    <a href="registry.html">Registry</a>
  </nav>
</body>
</html>
