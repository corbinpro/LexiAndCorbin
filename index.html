<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Bridal Shower</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      height: 100vh;
    }

    .invitation-img {
      height: 100%;
      width: auto;
      display: block;
    }

    .links {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      white-space: nowrap;
    }

    .links a {
      font-family: 'Dancing Script', cursive;
      font-size: 1.75rem;
      font-weight: 700;
      color: #6ab0e0;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="invitation-img" src="images/80percent.png" alt="Lexi's Bridal Shower Invitation" />
    <nav class="links">
      <a href="#placeholder">RSVP</a>
      <a href="registry.html">Registry</a>
    </nav>
  </div>
</body>
</html>
