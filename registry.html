<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Registry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .card {
      position: relative;
      width: min(calc(100vw - 16px), calc((100vh - 16px) * 1429 / 2000));
      aspect-ratio: 1429 / 2000;
    }

    .card-img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .registry-links {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2%;
      width: 72%;
    }

    .registry-links a {
      border-radius: 12px;
      display: inline-block;
      width: 100%;
    }

    .registry-links a img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .registry-links a:hover img {
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="card-img" src="images/registry_page.png" alt="Registry" />
    <div class="registry-links">
      <a href="https://www.amazon.com/wedding/guest-view/2X91PQO64QI1T" target="_blank" rel="noopener">
        <img src="images/amazonRegistryButton.png" alt="Amazon Registry" />
      </a>
      <a href="https://www.target.com/gift-registry/gift/lexi-and-corbin" target="_blank" rel="noopener">
        <img src="images/targetRegistryButton.png" alt="Target Registry" />
      </a>
    </div>
  </div>
  <script>
    const style = document.createElement('style');
    style.textContent = `
      @keyframes ghost-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(106,176,224,0.7); }
        70%  { box-shadow: 0 0 0 10px rgba(106,176,224,0); }
        100% { box-shadow: 0 0 0 0 rgba(106,176,224,0); }
      }
      .pulse { animation: ghost-pulse 2s ease-out infinite; }
    `;
    document.head.appendChild(style);
    document.querySelectorAll('.registry-links a').forEach(el => el.classList.add('pulse'));
  </script>
</body>
</html>
