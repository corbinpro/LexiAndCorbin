<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      height: 100vh;
    }

    .card-img {
      height: 100%;
      width: auto;
      display: block;
    }

    .registry-links {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      white-space: nowrap;
    }

    .registry-links a {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      font-weight: 700;
      color: #6ab0e0;
      text-decoration: none;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .registry-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="card-img" src="images/registry_page.png" alt="Registry" />
    <div class="registry-links">
      <a href="https://www.amazon.com/wedding/guest-view/2X91PQO64QI1T" target="_blank" rel="noopener">Amazon Registry</a>
      <a href="https://www.target.com/gift-registry/gift/lexi-and-corbin" target="_blank" rel="noopener">Target Registry</a>
    </div>
  </div>
</body>
</html>
