<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi's Registry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #fef9e7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      height: 100vh;
    }

    .card-img {
      height: 100%;
      width: auto;
      display: block;
    }

    .registry-links {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vh;
    }

    .registry-links a img {
      height: 8vh;
      width: auto;
      display: block;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .registry-links a:hover img {
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="card-img" src="images/registry_page.png" alt="Registry" />
    <div class="registry-links">
      <a href="https://www.amazon.com/wedding/guest-view/2X91PQO64QI1T" target="_blank" rel="noopener">
        <img src="images/amazonRegistryButton.png" alt="Amazon Registry" />
      </a>
      <a href="https://www.target.com/gift-registry/gift/lexi-and-corbin" target="_blank" rel="noopener">
        <img src="images/targetRegistryButton.png" alt="Target Registry" />
      </a>
    </div>
  </div>
</body>
</html>
